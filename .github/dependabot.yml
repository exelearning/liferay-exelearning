# Dependabot config for liferay-exelearning.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels: [dependencies, github-actions]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies, javascript]
    groups:
      dev-tooling:
        patterns: ["*"]

  # A Liferay Workspace has no root build.gradle; the build files live in the modules.
  - package-ecosystem: gradle
    directories: ["/modules/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    labels: [dependencies, java]
    ignore:
      # Liferay 7.4 ships JAX-RS 2.1 (javax.ws.rs); CXF 4+ is jakarta.ws.rs only.
      - dependency-name: "org.apache.cxf:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
