name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without publishing (x.y.z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  package:
    name: Build the installable release
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - name: Quality gate (formatting, unit tests, coverage)
        run: |
          npx biome ci .
          npx tsc -p tsconfig.json --noEmit
          npx vitest run --coverage
          scripts/gradlew.sh --console=plain \
            :modules:exelearning-web:checkSourceFormatting \
            :modules:exelearning-editor:checkSourceFormatting \
            :modules:exelearning-web:jacocoTestCoverageVerification
      - name: Build the package with the editor pinned in .editor-version
        env:
          EXELEARNING_EDITOR_REF_TYPE: tag
          VERSION: ${{ steps.version.outputs.version }}
        run: make package VERSION="$VERSION"
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/liferay-exelearning-${{ steps.version.outputs.version }}.zip
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: liferay-exelearning-${{ steps.version.outputs.version }}
          path: dist/*.zip*
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/liferay-exelearning-${{ steps.version.outputs.version }}.zip
            dist/liferay-exelearning-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true
