name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  validate:
    name: Validate repository and configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Check required files
        run: |
          for path in AGENTS.md CHANGELOG.md LICENSE README.md SECURITY.md THIRD-PARTY-NOTICES.md \
            .editor-version docs/installation.md docs/architecture/research.md \
            modules/exelearning-web/bnd.bnd modules/exelearning-editor/bnd.bnd; do
            test -f "$path" || { echo "::error file=$path::missing required file"; exit 1; }
          done
          ! git ls-files | grep -E '(^|/)\.env$' || { echo "::error::.env must not be committed"; exit 1; }

  lint-java:
    name: Java formatting and compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Liferay Source Formatter and compilation
        run: >-
          scripts/gradlew.sh --console=plain
          :modules:exelearning-web:checkSourceFormatting
          :modules:exelearning-editor:checkSourceFormatting
          :modules:exelearning-web:compileJava
          :modules:exelearning-web:compileTestJava

  lint-frontend:
    name: TypeScript lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: TypeScript
        run: npx tsc -p tsconfig.json --noEmit

  unit-tests-java:
    name: Java unit tests (90% line coverage)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests with JaCoCo coverage verification
        run: scripts/gradlew.sh --console=plain :modules:exelearning-web:jacocoTestCoverageVerification
      - name: Upload Java test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-coverage
          path: |
            modules/exelearning-web/build/reports/jacoco/test/
            modules/exelearning-web/build/test-results/test/
            modules/exelearning-web/build/reports/tests/test/
          if-no-files-found: warn
      - name: Upload coverage to Codecov (informational)
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: modules/exelearning-web/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

  unit-tests-frontend:
    name: TypeScript unit tests (90% line coverage)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest with coverage thresholds
        run: npx vitest run --coverage
      - name: Upload TypeScript coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-coverage
          path: build/reports/frontend-coverage/
          if-no-files-found: warn
      - name: Upload coverage to Codecov (informational)
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/frontend-coverage/lcov.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

  coverage:
    name: Coverage summary
    needs: [unit-tests-java, unit-tests-frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: java-coverage
          path: modules/exelearning-web/build/
      - uses: actions/download-artifact@v8
        with:
          name: typescript-coverage
          path: build/reports/frontend-coverage/
      - name: Enforce and summarize line coverage per language
        run: node scripts/coverage-summary.mjs

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

  build:
    name: Build and verify release artifacts
    needs: [validate, lint-java, lint-frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache the eXeLearning editor build
        uses: actions/cache@v6
        with:
          path: |
            build/exelearning-editor
            .cache/exelearning-editor
          key: exelearning-editor-${{ hashFiles('.editor-version', 'scripts/build-editor.sh') }}
      - run: npm ci
      - name: Package (builds editor, frontend and OSGi bundles; verifies contents)
        run: make package VERSION="$(node -p "require('./package.json').version")"
      - name: Upload deployable bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: |
            modules/exelearning-web/build/libs/*.jar
            modules/exelearning-editor/build/libs/*.jar
          if-no-files-found: error
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: dist/*.zip*
          if-no-files-found: error

  integration-tests:
    name: Integration tests (real Liferay)
    needs: [build, unit-tests-java, unit-tests-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The CSRF test drives a real browser session.
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: modules
      - name: Start Liferay and deploy the bundles
        run: |
          scripts/ci-env.sh
          docker compose up -d
          make wait deploy seed
      - name: Run integration tests
        run: npx playwright test --project=integration
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p test-results/diagnostics
          docker compose ps > test-results/diagnostics/ps.txt
          docker compose logs --no-color liferay > test-results/diagnostics/liferay.log 2>&1
          docker compose logs --no-color db > test-results/diagnostics/db.log 2>&1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn

  e2e-tests:
    name: End-to-end tests (Chromium)
    needs: [build, unit-tests-java, unit-tests-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: modules
      - name: Start Liferay, deploy and seed
        run: |
          scripts/ci-env.sh
          docker compose up -d
          make wait deploy seed
      - name: Run end-to-end tests
        run: npx playwright test --project=e2e-chromium
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p test-results/diagnostics
          docker compose ps > test-results/diagnostics/ps.txt
          docker compose logs --no-color liferay > test-results/diagnostics/liferay.log 2>&1
      - name: Upload screenshots, traces and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
